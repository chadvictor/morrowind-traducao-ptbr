name: Validar tradução
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/mwbr.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py --check-only
