"ClassicFalloffTooltip": "Padrão: desativado\nUsa a fórmula tradicional de atenuação de luz pontual, que não tem desvanecimento precoce.\n\nUma falha da fórmula tradicional é que a influência da luz nunca chega exatamente a zero.\nIsso é fisicamente preciso, mas pode causar emendas na iluminação, porque as luzes não afetam a cena inteira.\nO desvanecimento precoce ajuda a diminuir essas emendas ao custo de escurecer a cena.\n\nMorrowind usa a fórmula tradicional, então você pode querer ativar isto se não gostar das diferenças de brilho.\nComo alternativa, tente mudar o brilho mínimo de interiores."
