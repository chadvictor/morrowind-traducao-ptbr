"move360TurnSpeed": "Velocidade de Giro de 360 Graus"
"headBobbing_rollDescription": "O ângulo máximo de rolagem em graus (padrão: 0,2)."
"move360Description": "Torna a direção do movimento independente da direção da câmera enquanto a arma do personagem do jogador estiver embainhada. Por exemplo, o personagem do jogador olhará para a câmera enquanto corre para trás.\n"
"povAutoSwitchDescription": "Muda automaticamente para a visão em primeira pessoa se houver um obstáculo logo atrás do jogador."
"povAutoSwitch": "Troca Automática em Primeira Pessoa"
"headBobbing_heightDescription": "A amplitude da oscilação da cabeça (padrão: 3.0)."
"shoulderOffsetYDescription": "Deslocamento vertical da visão por cima do ombro.\n"
"headBobbing_roll": "Ângulo Máximo de Inclinação"
"headBobbing_step": "Comprimento Base do Passo"
"zoomOutWhenMoveCoef": "Coeficiente de Redução de Zoom ao Mover"
"shoulderOffsetXDescription": "Deslocamento horizontal da visão por cima do ombro. Para o ombro esquerdo, use um valor negativo.\n"
"settingsPageDescription": "Configurações de câmera do OpenMW."
"move360TurnSpeedDescription": "Multiplicador da velocidade de rotação (padrão: 5,0)."
"deferredPreviewRotation": "Rotação de Prévia Adiada"
"autoSwitchShoulder": "Troca Automática de Ombro"
"Camera": "Câmera do OpenMW"
"ignoreNC": "Ignorar o Indicador 'Sem Colisão'"
"shoulderOffsetY": "Deslocamento Vertical da Visão de Ombro"
"shoulderOffsetX": "Deslocamento Horizontal da Vista de Ombro"
"headBobbing_enabled": "Ativado"
"previewIfStandStillDescription": "Impede que o personagem do jogador vire na direção da câmera enquanto estiver parado e com a arma embainhada.\n"
"headBobbingSettings": "Balanço da Cabeça na Visão em Primeira Pessoa"
"previewIfStandStill": "Pré-visualizar se o jogador estiver parado"
"deferredPreviewRotationDescription": "Se habilitado, o personagem gira suavemente para a direção da visão após sair do modo de visualização ou de vaidade.\nSe desabilitado, a câmera gira em vez do personagem.\n"
"slowViewChangeDescription": "Torna a transição da visão em 1ª pessoa para a visão em 3ª pessoa não instantânea."
"viewOverShoulder": "Visão por sobre o ombro"
"zoomOutWhenMoveCoefDescription": "Afasta a câmera (valor positivo) ou a aproxima (valor negativo) do personagem enquanto ele se move. Funciona apenas se \"visão sobre o ombro\" estiver ativada. Defina como zero para desativar (padrão: 20.0).\n"
"move360": "Mover 360"
"autoSwitchShoulderDescription": "Quando há obstáculos que empurrariam a câmera para perto do personagem do jogador, esta configuração faz a câmera mudar automaticamente para o ombro mais distante dos obstáculos.\n"
"viewOverShoulderDescription": "Controla o modo de visão em terceira pessoa.\n  Não: a visão fica centralizada na cabeça do personagem. A mira fica oculta.\n  Sim: com a arma guardada, a câmera fica posicionada atrás do ombro do personagem, e a mira fica sempre visível.\n"
"slowViewChange": "Mudança Suave de Visão"
"ignoreNCDescription": "Impede que a câmera atravesse objetos que tenham o sinalizador NC (No Collision) ativado no modelo NIF.\n"
"headBobbing_stepDescription": "O comprimento de cada passo (padrão: 90.0)."
"headBobbing_height": "Altura do Passo"
"thirdPersonSettings": "Modo em Terceira Pessoa"
